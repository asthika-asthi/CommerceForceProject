services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:password@db:5432/commerce
      - JWT_SECRET=ZrwNW914we-soMtyyr7SdhkJtS9p9WC_t1aGRBUa3r4oKnFL4QPWDMfNqLyAgY8GprxpU8zeZQpEC_MWxdZlEw
    depends_on:
      db:
        condition: service_healthy
    networks:
      - commerce-net

  db:
    image: postgres:15-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=commerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - commerce-net

networks:
  commerce-net:
    driver: bridge

volumes:
  postgres_data:
