services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - commerce-net

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    # Removed ports to prevent external bot/process interference
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - commerce-net

networks:
  commerce-net:
    driver: bridge

volumes:
  postgres_data:
