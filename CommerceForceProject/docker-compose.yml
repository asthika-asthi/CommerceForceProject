services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - commerce-net

  db:
    image: postgres:15-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - commerce-net

networks:
  commerce-net:
    driver: bridge

volumes:
  postgres_data:
